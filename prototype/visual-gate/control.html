<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Mirror controls</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; padding: 18px; background: #080a0f; color: #d9e4f5;
      font: 15px system-ui, sans-serif; max-width: 760px; margin-inline: auto; }
    h1 { color: #9ed3ff; font-weight: 400; margin: 0 0 4px; }
    h2 { color: #8fb8dc; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
      margin: 24px 0 8px; }
    .meta { color: #77879a; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
    .card { background: #101722; border: 1px solid #243447; border-radius: 8px; padding: 12px; }
    .label { color: #8295aa; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .value { margin-top: 5px; font-size: 21px; color: #edf5ff; }
    button { background: #142235; border: 1px solid #41678e; color: #d9edff; border-radius: 7px;
      padding: 10px 14px; font-size: 15px; }
    button.active { border-color: #62c995; color: #9ee8c1; }
    .ticker-row { display:flex; align-items:center; justify-content:space-between; gap:8px;
      padding:7px 9px; margin:4px 0; background:#101722; border:1px solid #243447; border-radius:6px; }
    .ticker-row label { flex:1; }
    .ticker-row button { padding:3px 10px; border-color:#714b55; color:#f0a7ad; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #0e141d; border: 1px solid #202e3e;
      border-radius: 8px; padding: 12px; max-height: 420px; overflow: auto; font-size: 12px; }
    a { color: #9ed3ff; }
  </style>
</head>
<body>
  <h1>AI-Mirror controls</h1>
  <div class="meta">Live diagnostics for the visual gate. Mirror display: <a href="http://" id="display">visual port</a></div>
  <p><button onclick="refresh()">Refresh data</button> <button onclick="pump()">Request feed update</button> <button onclick="refreshCalendar()">Refresh calendar</button></p>
  <h2>Feeds</h2><div class="grid" id="feeds"></div>
    <h2>Configuration</h2><div class="grid" id="config"></div>
  <p><button onclick="saveConfig()">Save HA mappings</button> <span class="meta" id="saveMeta"></span></p>
  <h2>Avatar selection</h2><div class="grid" id="avatars"></div>
  <p class="meta" id="avatarMeta">Avatar selection is persisted for the avatar/Pygame mode.</p>
  <h2>Stock watchlist</h2><div id="tickerRows"></div>
  <p><input id="newTicker" placeholder="Add ticker, e.g. RR.L" style="width:70%;box-sizing:border-box;background:#0b1119;color:#d9e4f5;border:1px solid #30455d;border-radius:5px;padding:9px">
    <button onclick="addTicker()">Add</button> <span class="meta" id="tickerMeta"></span></p>
  <h2>Visual modules</h2><div class="grid" id="modules"></div>
  <h2>Visual data</h2><pre id="payload">Loading...</pre>
  <script>
    const display = document.getElementById('display');
    display.href = location.protocol + '//' + location.hostname + ':8795/';
    async function refresh() {
      const r = await fetch('/api/state.json', {cache: 'no-store'});
      const data = await r.json();
      const feeds = document.getElementById('feeds'); feeds.innerHTML = '';
      for (const [key, value] of Object.entries(data)) {
        if (key.startsWith('_') || key === 'generated') continue;
        const card = document.createElement('div'); card.className = 'card';
        card.innerHTML = '<div class="label">' + key + '</div><div class="value">available</div>';
        feeds.appendChild(card);
      }
      if (!feeds.children.length) feeds.innerHTML = '<div class="meta">No live feeds have returned data yet.</div>';
      const status = await (await fetch('/api/control/status', {cache: 'no-store'})).json();
      const cal = status.calendar || {};
      const calCard = document.createElement('div'); calCard.className = 'card';
      calCard.innerHTML = '<div class="label">calendar</div><div class="value">' +
        (cal.available ? (cal.parsed_events || 0) + ' events' : 'unavailable') + '</div>' +
        '<div class="meta">credentials: ' + (cal.credentials_configured ? 'configured' : 'missing') +
        (cal.last_error ? '<br>error: ' + cal.last_error : '') + '</div>';
      feeds.appendChild(calCard);
      const config = document.getElementById('config'); config.innerHTML = '';
      for (const [key, set] of Object.entries(status.configured_entities || {})) {
        const card = document.createElement('div'); card.className = 'card';
        const input = document.createElement('input'); input.id = 'cfg-' + key;
        input.value = status.entity_values && status.entity_values[key] || '';
        input.placeholder = key === 'light_entities' ? 'comma-separated entity ids' : 'entity id';
        input.style = 'width:100%;box-sizing:border-box;margin-top:7px;background:#0b1119;color:#d9e4f5;border:1px solid #30455d;border-radius:5px;padding:7px';
        card.innerHTML = '<div class="label">' + key.replaceAll('_', ' ') + '</div>';
        card.appendChild(input);
        config.appendChild(card);
      }
      const avatars = document.getElementById('avatars'); avatars.innerHTML = '';
      for (const avatar of (status.avatars || [])) {
        const b = document.createElement('button'); b.textContent = avatar.name;
        b.className = avatar.selected ? 'active' : ''; b.disabled = !avatar.reference_available;
        b.onclick = () => selectAvatar(avatar.key); avatars.appendChild(b);
      }
      if (!document.getElementById('tickerRows').contains(document.activeElement)) renderTickers(status.tickers || []);
      const modules = document.getElementById('modules'); modules.innerHTML = '';
      for (const [key, on] of Object.entries(status.visibility || {})) {
        const b = document.createElement('button'); b.textContent = key + ': ' + (on ? 'ON' : 'OFF');
        b.className = on ? 'active' : ''; b.onclick = () => toggleModule(key, !on); modules.appendChild(b);
      }
      document.getElementById('payload').textContent = JSON.stringify(data, null, 2);
    }
    async function saveConfig() {
      const keys = ['power_entity','solar_entity','car_soc_entity','light_entities',
        'upstairs_temp_entity','upstairs_humidity_entity','downstairs_temp_entity',
        'downstairs_humidity_entity','bedroom_occupancy_entity','livingroom_curtain_entity'];
      const updates = {}; for (const key of keys) updates[key] = document.getElementById('cfg-' + key)?.value || '';
      const r = await fetch('/api/control/config', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(updates)});
      document.getElementById('saveMeta').textContent = r.ok ? 'Saved and applied.' : 'Save failed.';
      refresh();
    }
    async function selectAvatar(key) {
      const r = await fetch('/api/avatar', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({value:key})});
      document.getElementById('avatarMeta').textContent = r.ok ? 'Avatar selection saved.' : 'Avatar selection failed.';
      refresh();
    }
    function renderTickers(tickers) {
      const box = document.getElementById('tickerRows'); box.innerHTML = '';
      if (!tickers.length) { box.innerHTML = '<div class="meta">No tickers selected.</div>'; return; }
      for (const ticker of tickers) {
        const row = document.createElement('div'); row.className = 'ticker-row';
        row.innerHTML = '<label><input type="checkbox" checked> ' + ticker + '</label>' +
          '<button title="Remove ' + ticker + '" aria-label="Remove ' + ticker + '">×</button>';
        row.querySelector('input').onchange = saveTickers;
        row.querySelector('button').onclick = () => { row.remove(); saveTickers(); };
        box.appendChild(row);
      }
    }
    async function saveTickers() {
      const tickers = [...document.querySelectorAll('#tickerRows input[type=checkbox]:checked')]
        .map(box => box.parentElement.textContent.trim());
      const r = await fetch('/api/tickers', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tickers})});
      document.getElementById('tickerMeta').textContent = r.ok ? 'Watchlist saved.' : 'Watchlist save failed.';
      if (r.ok) renderTickers((await r.json()).tickers || tickers);
    }
    async function addTicker() {
      const input = document.getElementById('newTicker'); const value = input.value.trim();
      if (!value) return;
      const current = [...document.querySelectorAll('#tickerRows input[type=checkbox]')].map(box => box.parentElement.textContent.trim());
      if (!current.includes(value)) current.push(value);
      input.value = '';
      const r = await fetch('/api/tickers', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({tickers:current})});
      document.getElementById('tickerMeta').textContent = r.ok ? 'Ticker added.' : 'Ticker add failed.';
      if (r.ok) renderTickers((await r.json()).tickers || current);
    }
    async function toggleModule(key, value) {
      await fetch('/api/modules', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({[key]:value})});
      refresh();
    }
    async function pump() { await fetch('/api/control/pump', {method: 'POST'}); refresh(); }
    async function refreshCalendar() {
      const r = await fetch('/api/control/calendar-refresh', {method: 'POST'});
      document.getElementById('saveMeta').textContent = r.ok ? 'Calendar refresh queued.' : 'Calendar refresh failed.';
      setTimeout(refresh, 1500);
    }
    refresh().catch(e => document.getElementById('payload').textContent = String(e));
    setInterval(() => refresh().catch(() => {}), 10000);
  </script>
</body>
</html>
